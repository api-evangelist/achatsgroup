aid: achatsgroup
name: Achats Group
description: >-
  Achats Group (아샤그룹) is a South Korean media-commerce company founded in February 2017 and led by
  CEO Vivian Eun Young Lee, with offices in Pangyo (Seongnam) and Magok (Seoul). It manufactures
  and sells everyday consumer goods — sanitizing and deodorizing sprays, foot care, living care,
  health drinks and cosmetics — under its own brands Cellomon, ND247 / Neverdie, Biotreat and
  BringB, marketing them through short-form video and social advertising that routes buyers into
  its own Cafe24 storefronts and a Naver Smart Store. Public records put total funding near USD 6.2
  million through a Series B. It is a direct-to-consumer consumer-goods business, not a software
  vendor: as of 2026-09-06 achatsgroup.co.kr is a Cafe24-hosted brochure site still carrying
  unedited pages from its purchased template, with no developer portal, no API documentation, no
  SDK and no machine-readable API contract, and the brand storefronts are hosted Cafe24 malls whose
  only /api path is Cafe24's own.
