scope: >-
  Achats Group publishes no API, so there is no contract in which a standard could be declared.
  Every API and agent-protocol standard below is therefore recorded as applicable:false — a
  not-applicable, not a failure — so this file is never read as a compliance posture the company
  does not claim. Two items are applicable and genuinely unmet: RFC 9116 security.txt, which any
  company operating a public website can publish, and valid TLS on its own hostname, which the
  site does not currently serve. Those are the only actionable findings here.
