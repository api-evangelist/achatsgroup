domain_security_observed:
  source: security/achatsgroup-domain-security.yml
  summary: >-
    achatsgroup.co.kr fails TLS certificate validation on its own name — the origin presents a
    Sectigo-issued *.cafe24.com certificate (SAN: *.cafe24.com, cafe24.com), so a browser reaching
    https://achatsgroup.co.kr/ gets a hostname-mismatch warning and the site is only usable over
    plaintext HTTP. No HSTS header, no DNSSEC and no CAA record; an SPF record is published, DMARC
    is not.
  remedy: >-
    Provision a certificate covering achatsgroup.co.kr (Cafe24 offers this on the hosting plan),
    redirect HTTP to HTTPS, then add HSTS and a DMARC record.
